name: Release

# Запускается при пуше тега вида v6.0.1
#   git tag v6.0.1 && git push origin v6.0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # создать GitHub Release
  packages: write   # запушить образ в GHCR

jobs:
  release:
    name: WAR + Docker образ
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # com.palantir.git-version определяет версию по тегам
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build WAR
        run: ./gradlew --no-daemon build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Имя пакета в GHCR обязано быть в нижнем регистре,
          # поэтому оно задано явно, а не через github.repository
          images: ghcr.io/maximkr/trackstudio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ручные заметки пишем в файл: gh прикрепит их поверх автоматически
      # сгенерированного списка изменений
      - name: Подготовить описание релиза
        run: |
          cat > release-notes.md <<'EOF'
          ## Установка

          ### Docker

          ```bash
          docker run -d -p 8080:8080 ghcr.io/maximkr/trackstudio:TAG_PLACEHOLDER
          ```

          Приложению нужна PostgreSQL — готовая конфигурация в `docker-compose.yml`.

          ### WAR

          Приложенный `TrackStudio.war` разворачивается в Tomcat 9+ на JDK 21.
          Подробности — в [README](https://github.com/maximkr/TrackStudio#readme) и [вики](https://github.com/maximkr/TrackStudio/wiki).
          EOF
          sed -i "s/TAG_PLACEHOLDER/${GITHUB_REF_NAME}/" release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/TrackStudio.war \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes
