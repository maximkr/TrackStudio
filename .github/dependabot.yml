version: 2

updates:
  # Зависимости Gradle. Проект содержит много старых библиотек, поэтому
  # обновления сгруппированы и ограничены по количеству PR — иначе dependabot
  # завалит репозиторий десятками отдельных пулл-реквестов.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"
      hibernate:
        patterns:
          - "org.hibernate:*"
      lucene:
        patterns:
          - "org.apache.lucene:*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Struts 1.3.10 снят с поддержки в 2013 году, новых версий не будет.
      # Уход с него — отдельная большая задача, а не обновление зависимости.
      - dependency-name: "org.apache.struts:*"

      # Мажорные обновления не предлагаем. Проверено на практике: первый же
      # запуск dependabot открыл четыре отдельных PR с мажорами
      # (Lucene 7.6 -> 10.5 и 8.11, Hibernate 5.6 -> 7.4), и все четыре
      # уронили сборку. Такие переходы требуют переписывания кода и должны
      # планироваться отдельно, а не прилетать автоматическим PR.
      # Сгруппированные minor/patch при этом проходят сборку нормально.
      #
      # Когда соберётесь мигрировать, например, на Lucene 10 — временно
      # уберите это правило или сделайте обновление вручную.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Версии GitHub Actions в workflow
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
